server {
    listen 80;
    client_max_body_size 20M;

    # Dashboard de charts (HTML servido por Flask)
    location /charts/ {
        proxy_pass http://flask_charts:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API pública de charts (consumida por el frontend JS)
    location /api/v2/charts/ {
        proxy_pass http://flask_charts:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Microservicio de licencias
    location /api/v2/licensing/ {
        proxy_pass http://flask_licensing:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Todo lo demás va a Django
    # NOTA: /internal/charts/ NO está expuesto aquí — solo accesible
    # dentro de la red Docker entre flask_charts y django-web.
    location / {
        proxy_pass http://django-web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
