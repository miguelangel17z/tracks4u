{% load i18n %}
<!DOCTYPE html>
<html lang="{% get_current_language as LANGUAGE_CODE %}{{ LANGUAGE_CODE }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "Register" %} - Tracks4U</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'zinc': {
                            400: '#a1a1aa',
                            500: '#71717a',
                            600: '#52525b',
                            700: '#3f3f46',
                            800: '#27272a',
                            900: '#18181b',
                            950: '#09090b',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        }

        .btn-primary {
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            box-shadow: 0 20px 25px -5px rgba(220, 38, 38, 0.5), 0 8px 10px -6px rgba(220, 38, 38, 0.5);
            transform: translateY(-2px);
        }

        .input-field {
            transition: all 0.2s ease;
        }

        .input-field:focus {
            border-color: #DC2626;
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1);
        }

        .fade-in {
            animation: fadeIn 0.6s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-zinc-950">
    <div class="relative w-full min-h-screen bg-zinc-950 overflow-hidden flex items-center justify-center py-12">
        <!-- Background Image with Overlay -->
        <div class="absolute inset-0 opacity-10">
            <div class="absolute inset-0 bg-gradient-to-b from-zinc-950 via-zinc-950/80 to-zinc-950"></div>
        </div>

        <!-- Register Card -->
        <div class="relative z-10 w-full max-w-md mx-4 fade-in">
            <!-- Logo -->
            <div class="flex flex-col items-center mb-8">
                <a href="/" class="flex items-center gap-2 mb-2">
                    <div class="w-10 h-10 bg-gradient-to-br from-red-600 to-red-700 rounded-lg flex items-center justify-center shadow-lg shadow-red-900/50">
                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-white">
                            <circle cx="8" cy="18" r="4"/>
                            <path d="M12 18V2l7 4"/>
                        </svg>
                    </div>
                    <h1 class="text-3xl font-bold text-white tracking-tight">
                        Tracks<span class="text-red-600">4</span>U
                    </h1>
                </a>
                <p class="text-zinc-400 text-sm">{% trans "Create your account" %}</p>
            </div>

            <!-- Register Form -->
            <div class="bg-zinc-900/50 backdrop-blur-sm border border-zinc-800 rounded-xl p-8 shadow-2xl">
                <h2 class="text-2xl font-bold text-white mb-6">{% trans "Register" %}</h2>

                <form id="registerForm" class="space-y-4">
                    <div>
                        <label for="username" class="block text-sm font-medium text-zinc-300 mb-2">
                            {% trans "Username" %}
                        </label>
                        <input
                            type="text"
                            id="username"
                            placeholder="{% trans 'Choose a username' %}"
                            required
                            class="input-field w-full px-4 py-3 bg-zinc-800 border border-zinc-700 rounded-lg text-white placeholder-zinc-500 focus:outline-none"
                        >
                    </div>

                    <div>
                        <label for="email" class="block text-sm font-medium text-zinc-300 mb-2">
                            {% trans "Email" %}
                        </label>
                        <input
                            type="email"
                            id="email"
                            placeholder="{% trans 'Enter your email' %}"
                            required
                            class="input-field w-full px-4 py-3 bg-zinc-800 border border-zinc-700 rounded-lg text-white placeholder-zinc-500 focus:outline-none"
                        >
                    </div>

                    <div>
                        <label for="password" class="block text-sm font-medium text-zinc-300 mb-2">
                            {% trans "Password" %}
                        </label>
                        <input
                            type="password"
                            id="password"
                            placeholder="{% trans 'Create a password' %}"
                            required
                            class="input-field w-full px-4 py-3 bg-zinc-800 border border-zinc-700 rounded-lg text-white placeholder-zinc-500 focus:outline-none"
                        >
                    </div>

                    <!-- Message -->
                    <div id="mensaje" class="hidden p-4 rounded-lg">
                        <p class="text-sm"></p>
                    </div>

                    <button
                        type="button"
                        onclick="register()"
                        class="btn-primary w-full bg-red-600 hover:bg-red-700 text-white py-3 rounded-lg font-semibold shadow-lg shadow-red-900/50"
                    >
                        {% trans "Create Account" %}
                    </button>
                </form>

                <div class="mt-6 text-center">
                    <p class="text-zinc-400 text-sm">
                        {% trans "Already have an account?" %}
                        <a href="{% url 'login' %}" class="text-red-500 hover:text-red-400 font-medium">
                            {% trans "Sign in" %}
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let cookie of cookies) {
                    cookie = cookie.trim();
                    if (cookie.startsWith(name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        async function register() {
            const username = document.getElementById("username").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const mensajeEl = document.getElementById('mensaje');

            if (!username || !email || !password) {
                showMessage("{% trans 'Please fill in all fields' %}", 'error');
                return;
            }

            const data = { username, email, password };
            const csrftoken = getCookie('csrftoken');

            try {
                const response = await fetch("{% url 'api-register' %}", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRFToken": csrftoken
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {
                    showMessage("{% trans 'Account created successfully! Redirecting to login...' %}", 'success');
                    setTimeout(() => {
                        window.location.href = "{% url 'login' %}";
                    }, 2000);
                } else {
                    const errorMsg = result.error || result.detail || JSON.stringify(result);
                    showMessage(errorMsg, 'error');
                }
            } catch (error) {
                showMessage("{% trans 'Connection error. Please try again.' %}", 'error');
            }
        }

        function showMessage(text, type) {
            const mensajeEl = document.getElementById('mensaje');
            const textEl = mensajeEl.querySelector('p');

            textEl.textContent = text;

            if (type === 'error') {
                mensajeEl.className = 'p-4 bg-red-900/20 border border-red-800 rounded-lg';
                textEl.className = 'text-red-400 text-sm';
            } else {
                mensajeEl.className = 'p-4 bg-green-900/20 border border-green-800 rounded-lg';
                textEl.className = 'text-green-400 text-sm';
            }

            mensajeEl.classList.remove('hidden');
        }
    </script>
</body>
</html>
