<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
    <h2>Iniciar Sesión</h2>
    <input type="username" id="username" placeholder="Email"><br><br>
    <input type="password" id="password" placeholder="Contraseña"><br><br>
    <button onclick="login()">Entrar</button>

    <p id="mensaje"></p>

    <script>
        function getCsrfToken() {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let cookie of cookies) {
                cookie = cookie.trim();
                if (cookie.startsWith('csrftoken=')) {
                    cookieValue = decodeURIComponent(cookie.substring('csrftoken='.length));
                    break;
                }
            }
        }
        return cookieValue;
    }
        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            const response = await fetch("{% url 'api-login' %}", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json',
                            'X-CSRFToken': getCsrfToken(), 
                 },

                body: JSON.stringify({ username, password })
            });

            const data = await response.json();

            if (response.ok) {
             localStorage.setItem('token', data.token); // guardar el token
            window.location.href = '/tracks/';  // redirigir a profile

                document.getElementById('mensaje').textContent = 'Login exitoso';
                console.log('Token:', data.token); // si usas tokens
            } else {
                document.getElementById('mensaje').textContent = 'Error: ' + JSON.stringify(data);
            }
        }
    </script>
</body>
</html>
