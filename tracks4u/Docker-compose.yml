version: "3.9"

services:

  django-web:
    build: .
    volumes:
      - .:/app
    expose:
      - "8000"
    depends_on:
      - redis
    environment:
      - NOTIFICATION_MODE=REAL
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=tracks4u.settings

  celery-worker:
    build: .
    command: celery -A tracks4u worker --loglevel=info
    volumes:
      - .:/app
    depends_on:
      - redis
      - django-web
    environment:
      - NOTIFICATION_MODE=REAL
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=tracks4u.settings

  redis:
    image: redis:7-alpine
    expose:
      - "6379"

  flask_licensing:
    build: ./flask_licensing
    volumes:
      - ./flask_licensing:/app
    expose:
      - "5000"

  flask_charts:
    build: ./flask_charts
    volumes:
      - ./flask_charts:/app
    expose:
      - "5001"
    depends_on:
      - django-web

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - django-web
      - flask_licensing
      - flask_charts