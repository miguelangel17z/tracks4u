version: "3.9"

services:

  django-web:
    build: .
    volumes:
      - .:/app
    expose:
      - "8000"

  flask_licensing:
    build: ./flask_licensing
    volumes:
      - ./flask_licensing:/app
    expose:
      - "5000"

  flask_charts:
    build: ./flask_charts
    volumes:
      - ./flask_charts:/app
    expose:
      - "5001"
    depends_on:
      - django-web

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - django-web
      - flask_licensing
      - flask_charts
